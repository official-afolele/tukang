<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DJ PRO - AI Tool Workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #0b0f19; color: #f1f5f9; display: flex; height: 100vh; overflow: hidden; }

    .mobile-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(3px); z-index: 90;
    }
    .mobile-overlay.active { display: block; }

    .floating-hamburger {
      display: none; position: fixed; top: 12px; left: 12px; z-index: 100;
      background: #1e293b; border: 1px solid #334155; color: #f8fafc;
      width: 36px; height: 36px; border-radius: 8px; align-items: center;
      justify-content: center; cursor: pointer; font-size: 18px;
    }

    /* SIDEBAR */
    aside {
      width: 260px; background: #0f172a; border-right: 1px solid #1e293b; display: flex;
      flex-direction: column; justify-content: flex-start; padding: 18px 14px; flex-shrink: 0;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 95;
    }
    .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding: 0 8px; }
    .brand-content { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 38px; height: 38px; background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-size: 18px; box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }
    .brand-title { font-size: 15px; font-weight: 700; }
    .brand-title span { color: #818cf8; }
    .brand-sub { font-size: 10px; color: #64748b; font-weight: 500; }
    .btn-close-sidebar { display: none; background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; }

    .menu-group { display: flex; flex-direction: column; gap: 6px; }
    
    /* PANEL EDIT LAYANAN UTAMA (TERPISAH DI SIDEBAR) */
    .service-header-wrap {
      display: flex; justify-content: space-between; align-items: center; margin: 18px 8px 6px;
    }
    .menu-label { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.8px; }
    .btn-add-service {
      display: none; background: #334155; border: none; color: #818cf8; padding: 2px 7px;
      border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: 700;
    }
    .is-admin .btn-add-service { display: inline-block; }

    .nav-btn-wrap { display: flex; align-items: center; position: relative; }
    .nav-btn {
      width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px;
      background: transparent; border: none; border-radius: 10px; color: #94a3b8;
      font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; text-align: left;
    }
    .nav-btn:hover { background: #1e293b; color: #f8fafc; }
    .nav-btn.active {
      background: rgba(99, 102, 241, 0.15); color: #818cf8; font-weight: 600;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .nav-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

    .nav-action-btns {
      display: none; position: absolute; right: 6px; gap: 3px; z-index: 10;
    }
    .is-admin .nav-action-btns { display: flex; }
    .btn-nav-act {
      background: #1e293b; border: 1px solid #475569; color: #f8fafc;
      width: 22px; height: 22px; border-radius: 4px; font-size: 10px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .btn-nav-act.delete:hover { background: #ef4444; border-color: #ef4444; }

    /* MAIN VIEWPORT */
    main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #080d1a; position: relative; }
    .content-area { flex: 1; width: 100%; height: 100%; overflow: hidden; position: relative; }
    .page-view { display: none; height: 100%; width: 100%; flex-direction: column; }
    .page-view.active { display: flex; }

    /* AI HUB */
    .ai-hub-container {
      padding: 24px 20px 30px 20px; overflow-y: auto; height: 100%; display: flex; flex-direction: column;
    }
    
    /* JUDUL DI TENGAH ATAS DI PC DAN HP */
    .hub-header-bar {
      position: relative; display: flex; justify-content: center; align-items: center;
      margin-bottom: 24px; width: 100%; min-height: 38px;
    }
    .center-title-header { text-align: center; }
    .center-title-header h1 {
      font-size: 22px; font-weight: 800; color: #ffffff; letter-spacing: -0.3px;
      cursor: pointer; display: inline-block; user-select: none;
    }

    /* KONTROL ADMIN (AI TOOLS WORKSPACE) */
    .admin-controls-logged {
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
      display: none; align-items: center; gap: 8px; z-index: 2;
    }
    .is-admin .admin-controls-logged { display: flex; }
    .admin-badge-user {
      font-size: 11px; color: #4ade80; background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3); padding: 4px 8px; border-radius: 6px; font-weight: 600;
    }
    .btn-add-item {
      background: #6366f1; color: white; border: none; padding: 6px 12px;
      border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer;
    }
    .btn-logout {
      background: #ef4444; color: white; border: none; padding: 6px 10px;
      border-radius: 8px; font-size: 11px; cursor: pointer;
    }

    /* GRID: 3 KOLOM DI PC */
    .ai-tools-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding-bottom: 30px;
    }
    .ai-card {
      background: #0f172a; border: 1.5px solid #1e293b; border-radius: 14px;
      padding: 16px; display: flex; flex-direction: column; justify-content: space-between;
      gap: 12px; transition: all 0.2s ease; position: relative; text-decoration: none; color: inherit;
    }
    .ai-card:hover { border-color: #6366f1; transform: translateY(-3px); }
    .ai-card-header { display: flex; justify-content: space-between; align-items: center; }
    .ai-brand { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .ai-logo {
      width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-size: 18px; font-weight: bold; color: white; flex-shrink: 0;
    }
    .ai-name { font-size: 14px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ai-desc { font-size: 12px; color: #94a3b8; line-height: 1.45; min-height: 34px; }
    .ai-card-footer {
      display: flex; justify-content: space-between; align-items: center; padding-top: 10px;
      border-top: 1px solid #1e293b; gap: 6px;
    }
    .ai-domain { font-size: 11px; font-weight: 500; color: #60a5fa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ai-badge {
      font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 20px;
      background: rgba(34, 197, 94, 0.12); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.25); flex-shrink: 0;
    }
    .ai-badge.freemium { background: rgba(234, 179, 8, 0.12); color: #facc15; border-color: rgba(234, 179, 8, 0.25); }
    .ai-badge.trial { background: rgba(168, 85, 247, 0.12); color: #c084fc; border-color: rgba(168, 85, 247, 0.25); }
    .ai-badge.paid { background: rgba(239, 68, 68, 0.12); color: #f87171; border-color: rgba(239, 68, 68, 0.25); }

    .card-admin-actions {
      display: none; position: absolute; top: 8px; right: 8px; gap: 4px; z-index: 10;
    }
    .is-admin .card-admin-actions { display: flex; }
    .btn-mini {
      background: #1e293b; border: 1px solid #475569; color: #f8fafc; width: 26px; height: 26px;
      border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px;
    }
    .btn-mini:hover { background: #334155; }
    .btn-mini.delete:hover { background: #ef4444; border-color: #ef4444; }

    /* MODAL */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
      z-index: 200; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal-box {
      background: #0f172a; border: 1px solid #334155; border-radius: 14px; width: 100%;
      max-width: 420px; padding: 20px; display: flex; flex-direction: column; gap: 14px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 16px; font-weight: 700; color: #fff; }
    .modal-close { background: none; border: none; color: #94a3b8; font-size: 18px; cursor: pointer; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
    .form-input {
      background: #080d1a; border: 1px solid #334155; color: #fff; padding: 8px 12px;
      border-radius: 8px; font-size: 13px; outline: none;
    }
    .form-input:focus { border-color: #6366f1; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .btn-action {
      background: #6366f1; color: white; border: none; padding: 8px 14px; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-tool { background: #1e293b; border: 1px solid #334155; }

    .full-embed-container { width: 100%; height: 100%; border: none; background: #0b1120; }
    .full-embed-container iframe { width: 100%; height: 100%; border: none; background: #ffffff; }

    /* RESPONSIVE HP: WAJIB 2 KOLOM */
    @media (max-width: 768px) {
      aside { position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transform: translateX(-100%); }
      aside.open { transform: translateX(0); }
      .btn-close-sidebar, .floating-hamburger { display: flex; }
      .ai-hub-container { padding: 50px 10px 20px 10px; }
      .center-title-header h1 { font-size: 18px; }
      .ai-tools-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 10px; }
      .ai-card { padding: 12px 10px; border-radius: 12px; gap: 10px; }
      .ai-logo { width: 30px; height: 30px; font-size: 15px; }
      .ai-name { font-size: 12px; }
      .ai-desc { font-size: 10px; min-height: 28px; }
      .ai-domain { font-size: 9px; }
      .ai-badge { font-size: 8px; padding: 2px 5px; }
      .admin-badge-user { display: none; }
    }
  </style>
</head>
<body id="app-body">

  <button class="floating-hamburger" onclick="openSidebar()">☰</button>
  <div id="mobile-overlay" class="mobile-overlay" onclick="closeSidebar()"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div>
      <div class="brand">
        <div class="brand-content">
          <div class="brand-icon">⚡</div>
          <div>
            <div class="brand-title">DJ <span>PRO</span></div>
            <div class="brand-sub">Web Pribadi Jaka</div>
          </div>
        </div>
        <button class="btn-close-sidebar" onclick="closeSidebar()">✕</button>
      </div>

      <nav class="menu-group">
        <button onclick="openTab('dashboard')" id="nav-dashboard" class="nav-btn active">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          AI Tools Hub
        </button>

        <!-- PANEL EDIT LAYANAN UTAMA (TERPISAH) -->
        <div class="service-header-wrap">
          <span class="menu-label">Layanan Utama</span>
          <button class="btn-add-service" onclick="openServiceModal(-1)">+ Tambah</button>
        </div>

        <div id="services-nav-container" class="menu-group"></div>
      </nav>
    </div>
  </aside>

  <!-- MAIN VIEWPORT -->
  <main>
    <div class="content-area" id="dynamic-content-area">

      <!-- AI TOOL WORKSPACE -->
      <section id="view-dashboard" class="page-view active">
        <div class="ai-hub-container">
          <div class="hub-header-bar">
            <div class="center-title-header">
              <h1 onclick="goToHome()">AI Tool Workspace</h1>
            </div>

            <!-- PANEL EDIT AI TOOLS (TERPISAH) -->
            <div id="admin-logged-group" class="admin-controls-logged">
              <span id="current-user-badge" class="admin-badge-user">Admin</span>
              <button class="btn-add-item" onclick="openAddModal()">+ Tambah AI</button>
              <button class="btn-logout" onclick="logoutAdmin()">Logout</button>
            </div>
          </div>

          <!-- GRID KARTU (3 DI PC, 2 DI HP) -->
          <div id="ai-tools-grid" class="ai-tools-grid"></div>
        </div>
      </section>

    </div>
  </main>

  <!-- MODAL LOGIN ADMIN (/admin) -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">🔐 Login Admin Portal</div>
        <button class="modal-close" onclick="closeLoginModal()">✕</button>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-user" class="form-input">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" class="form-input" onkeydown="if(event.key==='Enter') executeLogin()">
      </div>
      <div id="login-error-msg" style="display:none; font-size:12px; color:#f87171;"></div>
      <div class="modal-actions">
        <button type="button" class="btn-action btn-tool" onclick="closeLoginModal()">Batal</button>
        <button type="button" class="btn-action" onclick="executeLogin()">Masuk</button>
      </div>
    </div>
  </div>

  <!-- MODAL EDIT AI TOOLS -->
  <div id="admin-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div id="modal-heading" class="modal-title">Tambah AI Baru</div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <input type="hidden" id="edit-tool-row" value="-1">
      <div class="form-group">
        <label>Nama AI</label>
        <input type="text" id="tool-name" class="form-input">
      </div>
      <div class="form-group">
        <label>URL Website</label>
        <input type="url" id="tool-url" class="form-input">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Emoji / Logo</label>
          <input type="text" id="tool-logo" class="form-input">
        </div>
        <div class="form-group">
          <label>Warna Background</label>
          <input type="text" id="tool-color" class="form-input">
        </div>
      </div>
      <div class="form-group">
        <label>Deskripsi</label>
        <textarea id="tool-desc" class="form-input" rows="2"></textarea>
      </div>
      <div class="form-group">
        <label>Badge</label>
        <select id="tool-badge" class="form-input">
          <option value="Free">Free</option>
          <option value="Freemium">Freemium</option>
          <option value="Trial">Trial</option>
          <option value="Paid">Paid</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-action btn-tool" onclick="closeModal()">Batal</button>
        <button type="button" id="btn-save-modal" class="btn-action" onclick="saveTool()">Simpan Data</button>
      </div>
    </div>
  </div>

  <!-- MODAL EDIT LAYANAN UTAMA -->
  <div id="service-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div id="service-modal-heading" class="modal-title">Kelola Layanan Utama</div>
        <button class="modal-close" onclick="closeServiceModal()">✕</button>
      </div>
      <input type="hidden" id="service-row" value="-1">
      <div class="form-group">
        <label>Nama Layanan</label>
        <input type="text" id="service-name" class="form-input" placeholder="contoh: Pembuat Surat Resmi">
      </div>
      <div class="form-group">
        <label>URL Iframe Embed</label>
        <input type="url" id="service-url" class="form-input" placeholder="https://surat-menjalin.vercel.app/">
      </div>
      <div class="form-group">
        <label>Warna Ikon (#hex)</label>
        <input type="text" id="service-color" class="form-input" value="#818cf8">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-action btn-tool" onclick="closeServiceModal()">Batal</button>
        <button type="button" id="btn-save-service" class="btn-action" onclick="saveService()">Simpan Layanan</button>
      </div>
    </div>
  </div>

  <script>
    // URL Web App Google Spreadsheet Anda:
    const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbzXQAK-LDzCrRYT8YpcHGjh7DalICrslIrEJf44Lb_zoTiHqQGdZ_gdjUEhi8DikDEV/exec";

    const DEFAULT_ADMIN = { username: "admin", password: "admin123" };

    const DEFAULT_TOOLS = [
      { name: "ChatGPT", url: "https://chat.openai.com", domain: "chat.openai.com", logo: "🟢", color: "#10a37f", desc: "Free AI chat with daily limits, advanced reasoning, and internet browsing.", badge: "Free" },
      { name: "Claude", url: "https://claude.ai", domain: "claude.ai", logo: "✳️", color: "#d97706", desc: "Free AI assistant with generous limits, natural tone, and large document context.", badge: "Free" },
      { name: "JustPaste.it", url: "https://justpaste.it", domain: "justpaste.it", logo: "📝", color: "#f97316", desc: "Free text, script, and markdown sharing tool with instant formatting and links.", badge: "Free" }
    ];

    const DEFAULT_SERVICES = [
      { id: "surat", name: "Pembuat Surat Resmi", url: "https://surat-menjalin.vercel.app/", iconColor: "#818cf8" },
      { id: "scribd", name: "Scribd Reader & PDF", url: "https://www.scribd.com/embeds/715129338/content?start_page=1&view_mode=scroll&access_key=key-fFexxf7r1bzEfWu3HKwf", iconColor: "#4ade80" }
    ];

    let aiTools = [];
    let services = [];
    let currentUser = localStorage.getItem('dj_admin_user') || null;

    // AMBIL DATA DARI GOOGLE SPREADSHEET (Anti-CORS / Anti-Redirect Issue)
    async function loadSpreadsheetData() {
      try {
        const [resTools, resServices] = await Promise.all([
          fetch(`${SPREADSHEET_URL}?type=tools`, { redirect: 'follow' }),
          fetch(`${SPREADSHEET_URL}?type=services`, { redirect: 'follow' })
        ]);

        const toolsData = await resTools.json();
        const servicesData = await resServices.json();

        aiTools = (toolsData && toolsData.length > 0) ? toolsData : DEFAULT_TOOLS;
        services = (servicesData && servicesData.length > 0) ? servicesData : DEFAULT_SERVICES;
      } catch (e) {
        console.warn("Menggunakan data default (Menghubungkan ke Sheet...):", e);
        if (aiTools.length === 0) aiTools = DEFAULT_TOOLS;
        if (services.length === 0) services = DEFAULT_SERVICES;
      }

      renderTools();
      renderServices();
    }

    // KIRIM PERUBAHAN KE GOOGLE SPREADSHEET
    async function sendToSpreadsheet(payload) {
      try {
        await fetch(SPREADSHEET_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Gagal mengirim ke sheet:", err);
      }
      setTimeout(loadSpreadsheetData, 1200);
    }

    // ================= ROUTE /admin ================= //
    function checkAdminRoute() {
      const path = window.location.pathname.toLowerCase();
      if (path.endsWith('/admin') || path.endsWith('/admin/')) {
        if (!currentUser) openLoginModal();
      }
    }

    function updateAuthUI() {
      const body = document.getElementById('app-body');
      const badge = document.getElementById('current-user-badge');

      if (currentUser) {
        body.classList.add('is-admin');
        badge.innerText = `● @${currentUser}`;
      } else {
        body.classList.remove('is-admin');
      }
      renderTools();
      renderServices();
    }

    function openLoginModal() {
      document.getElementById('login-user').value = '';
      document.getElementById('login-pass').value = '';
      document.getElementById('login-error-msg').style.display = 'none';
      document.getElementById('login-modal').classList.add('active');
    }
    function closeLoginModal() {
      document.getElementById('login-modal').classList.remove('active');
      if (window.location.pathname.toLowerCase().includes('/admin')) {
        window.history.replaceState({}, '', '/');
      }
    }
    function executeLogin() {
      const user = document.getElementById('login-user').value.trim();
      const pass = document.getElementById('login-pass').value.trim();
      const errBox = document.getElementById('login-error-msg');
      if (user === DEFAULT_ADMIN.username && pass === DEFAULT_ADMIN.password) {
        currentUser = user;
        localStorage.setItem('dj_admin_user', user);
        closeLoginModal();
        updateAuthUI();
        window.history.replaceState({}, '', '/');
      } else {
        errBox.innerText = "Username atau password salah!";
        errBox.style.display = 'block';
      }
    }
    function logoutAdmin() {
      if (confirm("Logout dari akun admin?")) {
        currentUser = null;
        localStorage.removeItem('dj_admin_user');
        updateAuthUI();
      }
    }

    // ================= RENDER TOOLS (3 KOLOM PC, 2 KOLOM HP) ================= //
    function renderTools() {
      const grid = document.getElementById('ai-tools-grid');
      grid.innerHTML = '';

      aiTools.forEach((tool, index) => {
        const badgeClass = (tool.badge || 'free').toLowerCase();
        const card = document.createElement('div');
        card.className = 'ai-card';
        card.innerHTML = `
          <div class="card-admin-actions">
            <button class="btn-mini" onclick="openEditModal(${index})" title="Edit">✏️</button>
            <button class="btn-mini delete" onclick="deleteTool(${index})" title="Hapus">🗑️</button>
          </div>
          <div>
            <div class="ai-card-header">
              <div class="ai-brand">
                <div class="ai-logo" style="background:${tool.color || '#6366f1'};">${tool.logo || '⚡'}</div>
                <div class="ai-name">${tool.name}</div>
              </div>
            </div>
            <p class="ai-desc" style="margin-top:10px;">${tool.desc || ''}</p>
          </div>
          <div class="ai-card-footer">
            <span class="ai-domain">${tool.domain || ''}</span>
            <span class="ai-badge ${badgeClass}">${tool.badge || 'Free'}</span>
          </div>
        `;
        card.addEventListener('click', (e) => {
          if (!e.target.closest('.card-admin-actions')) window.open(tool.url, '_blank');
        });
        grid.appendChild(card);
      });
    }

    // ================= RENDER LAYANAN UTAMA ================= //
    function renderServices() {
      const navContainer = document.getElementById('services-nav-container');
      const contentArea = document.getElementById('dynamic-content-area');

      navContainer.innerHTML = '';
      document.querySelectorAll('.page-view:not(#view-dashboard)').forEach(el => el.remove());

      services.forEach((srv, index) => {
        const srvId = srv.id || `srv_${index}`;

        const wrap = document.createElement('div');
        wrap.className = 'nav-btn-wrap';
        wrap.innerHTML = `
          <button onclick="openTab('${srvId}')" id="nav-${srvId}" class="nav-btn">
            <svg fill="none" viewBox="0 0 24 24" stroke="${srv.iconColor || '#818cf8'}" stroke-width="2">
              <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
            </svg>
            ${srv.name}
          </button>
          <div class="nav-action-btns">
            <button class="btn-nav-act" onclick="openServiceModal(${index})" title="Edit">✏️</button>
            <button class="btn-nav-act delete" onclick="deleteService(${index})" title="Hapus">🗑️</button>
          </div>
        `;
        navContainer.appendChild(wrap);

        const viewSection = document.createElement('section');
        viewSection.id = `view-${srvId}`;
        viewSection.className = 'page-view';
        viewSection.innerHTML = `
          <div class="full-embed-container">
            <iframe src="${srv.url}" allow="fullscreen; clipboard-read; clipboard-write;"></iframe>
          </div>
        `;
        contentArea.appendChild(viewSection);
      });
    }

    // ================= CRUD TOOLS KE SPREADSHEET ================= //
    function openAddModal() {
      document.getElementById('modal-heading').innerText = 'Tambah AI Baru';
      document.getElementById('edit-tool-row').value = '-1';
      document.getElementById('tool-name').value = '';
      document.getElementById('tool-url').value = '';
      document.getElementById('tool-logo').value = '⚡';
      document.getElementById('tool-color').value = '#6366f1';
      document.getElementById('tool-desc').value = '';
      document.getElementById('tool-badge').value = 'Free';
      document.getElementById('admin-modal').classList.add('active');
    }

    function openEditModal(i) {
      const t = aiTools[i];
      document.getElementById('modal-heading').innerText = 'Edit Kartu AI';
      document.getElementById('edit-tool-row').value = t.rowIndex || (i + 2);
      document.getElementById('tool-name').value = t.name;
      document.getElementById('tool-url').value = t.url;
      document.getElementById('tool-logo').value = t.logo;
      document.getElementById('tool-color').value = t.color;
      document.getElementById('tool-desc').value = t.desc;
      document.getElementById('tool-badge').value = t.badge;
      document.getElementById('admin-modal').classList.add('active');
    }

    function closeModal() { document.getElementById('admin-modal').classList.remove('active'); }

    async function saveTool() {
      const name = document.getElementById('tool-name').value.trim();
      let url = document.getElementById('tool-url').value.trim();
      const logo = document.getElementById('tool-logo').value.trim() || '⚡';
      const color = document.getElementById('tool-color').value.trim() || '#6366f1';
      const desc = document.getElementById('tool-desc').value.trim();
      const badge = document.getElementById('tool-badge').value;
      const rowIndex = parseInt(document.getElementById('edit-tool-row').value);

      if (!name || !url) return alert("Nama dan URL wajib diisi!");
      if (!url.startsWith('http')) url = 'https://' + url;
      let domain = url;
      try { domain = new URL(url).hostname.replace('www.', ''); } catch (e) {}

      const btn = document.getElementById('btn-save-modal');
      btn.innerText = 'Menyimpan...';

      const payload = {
        type: 'tools',
        action: rowIndex > 0 ? 'update' : 'create',
        rowIndex: rowIndex,
        name, url, domain, logo, color, desc, badge
      };

      closeModal();
      await sendToSpreadsheet(payload);
      btn.innerText = 'Simpan Data';
    }

    async function deleteTool(i) {
      const t = aiTools[i];
      if (!confirm(`Hapus tool "${t.name}" dari Spreadsheet?`)) return;
      await sendToSpreadsheet({
        type: 'tools',
        action: 'delete',
        rowIndex: t.rowIndex || (i + 2)
      });
    }

    // ================= CRUD SERVICES KE SPREADSHEET ================= //
    function openServiceModal(i) {
      const heading = document.getElementById('service-modal-heading');
      if (i >= 0) {
        const s = services[i];
        heading.innerText = 'Edit Layanan Utama';
        document.getElementById('service-row').value = s.rowIndex || (i + 2);
        document.getElementById('service-name').value = s.name;
        document.getElementById('service-url').value = s.url;
        document.getElementById('service-color').value = s.iconColor || '#818cf8';
      } else {
        heading.innerText = 'Tambah Layanan Utama';
        document.getElementById('service-row').value = '-1';
        document.getElementById('service-name').value = '';
        document.getElementById('service-url').value = '';
        document.getElementById('service-color').value = '#818cf8';
      }
      document.getElementById('service-modal').classList.add('active');
    }

    function closeServiceModal() { document.getElementById('service-modal').classList.remove('active'); }

    async function saveService() {
      const name = document.getElementById('service-name').value.trim();
      let url = document.getElementById('service-url').value.trim();
      const iconColor = document.getElementById('service-color').value.trim() || '#818cf8';
      const rowIndex = parseInt(document.getElementById('service-row').value);

      if (!name || !url) return alert("Nama dan URL Layanan wajib diisi!");
      if (!url.startsWith('http')) url = 'https://' + url;

      const btn = document.getElementById('btn-save-service');
      btn.innerText = 'Menyimpan...';

      const payload = {
        type: 'services',
        action: rowIndex > 0 ? 'update' : 'create',
        rowIndex: rowIndex,
        id: 'srv_' + Date.now(),
        name, url, iconColor
      };

      closeServiceModal();
      await sendToSpreadsheet(payload);
      btn.innerText = 'Simpan Layanan';
    }

    async function deleteService(i) {
      const s = services[i];
      if (!confirm(`Hapus layanan "${s.name}" dari Spreadsheet?`)) return;
      await sendToSpreadsheet({
        type: 'services',
        action: 'delete',
        rowIndex: s.rowIndex || (i + 2)
      });
      openTab('dashboard');
    }

    // ================= NAVIGASI ================= //
    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('mobile-overlay').classList.add('active');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('mobile-overlay').classList.remove('active');
    }
    function openTab(tabId) {
      document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      const targetView = document.getElementById('view-' + tabId);
      const targetNav = document.getElementById('nav-' + tabId);
      if (targetView) targetView.classList.add('active');
      if (targetNav) targetNav.classList.add('active');
      closeSidebar();
    }
    function goToHome() { openTab('dashboard'); }

    checkAdminRoute();
    updateAuthUI();
    loadSpreadsheetData();
  </script>
</body>
</html>
